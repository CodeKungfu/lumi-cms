version: "3"

# 后端已迁移到 apps/hono（Cloudflare Workers + D1），通过 wrangler 部署，不在本 compose 内。
# 本文件仅用于容器化前端 web，其 API 指向已部署的 hono Worker。

services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: always
    ports:
      - 3000:80
    environment:
      - VITE_APP_BASE_API=https://lumi-cms-hono.mike473091010.workers.dev
    networks:
      - app_network

networks:
  app_network:
    external: false
